name: Create pull request
description: 'This action creates a pull request from a branch to a target branch.'
author: 'DFINITY Stiftung'

inputs:
  branch_name:
    description: 'The name of the branch to create a pull request from.'
    required: false
    default: 'patch'
  base_branch_name:
    description: 'The name of the base branch to create a pull request against.'
    required: false
    default: 'main'
  reuse_branch:
    description: 'Reuse branch_name as-is instead of creating a new randomly suffixed branch on every run. The branch is reset to the current commit and force pushed, and the pull request already open for it is updated rather than duplicated; when there is nothing left to propose that pull request is closed. Enable this only for a branch owned by automation, since whatever is already on it is overwritten.'
    required: false
    default: 'false'

  pull_request_title:
    description: 'The title of the pull request.'
    required: false
    default: 'chore: automated by GitHub actions'
  pull_request_body:
    description: 'The body of the pull request.'
    default: 'This pull request was automatically created by a GitHub Action.'
    required: false

  author_name:
    description: 'The name of the author of the pull request and commit.'
    required: false
    default: '${{ github.actor }}'
  author_email:
    description: 'The email of the author of the pull request and commit.'
    required: false
    default: '${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com'

  commit_message:
    description: 'The message of the commit.'
    required: false
    default: 'chore: automated by GitHub actions'

  token:
    description: 'Access token to manage the pull request.'
    required: false
    default: '${{ github.token }}'

outputs:
  pull_request_number:
    description: 'The number of the pull request that was created, updated or closed. Empty when there was nothing to propose and no pull request was open.'
  pull_request_created:
    description: 'Whether the pull request was created.'
  pull_request_updated:
    description: 'Whether an already open pull request was updated instead of a new one being created. Only ever true when reuse_branch is enabled.'

runs:
  using: node24
  main: dist/index.js
