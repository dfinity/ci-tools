name: Generate changelog
description: "This action generates changelog based on the repository's commit messages written according to the Conventional Commits specification."

inputs:
  file_name:
    description: 'The name of the file to write the changelog to.'
    required: false
    default: 'CHANGELOG.md'

runs:
  using: composite
  steps:
    - name: Generate changelog
      shell: bash
      env:
        FILE_NAME: ${{ inputs.file_name }}
      run: |
        set +e
        cz changelog --incremental --merge-prerelease --file-name="$FILE_NAME" --version-scheme semver2
        exit_code=$?
        set -e

        # Commitizen exits 3 when it finds no commits to add to the changelog. That is a
        # no-op rather than a failure, so it must not fail the job.
        if [ "$exit_code" -eq 3 ]; then
          echo "::notice::No commits to add to the changelog; nothing to do."
          exit 0
        fi

        exit "$exit_code"
